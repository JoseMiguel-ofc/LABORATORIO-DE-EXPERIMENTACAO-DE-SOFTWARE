name: testes
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        # O repositório guarda todos os labs; o pipeline do Lab03 fica nesta pasta.
        working-directory: "LABORATORIO 03"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "LABORATORIO 03/requirements.txt"
      - run: pip install -r requirements.txt
      - run: pytest --cov=metricas --cov-report=term-missing --cov-fail-under=80
