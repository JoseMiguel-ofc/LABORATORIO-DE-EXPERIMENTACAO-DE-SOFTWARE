name: coleta-steam
# Lab05: mede a latência e a disponibilidade da Steam uma vez por hora e
# commita o CSV em "LABORATORIO 05/dados/brutos/".
#
# O agendador do GitHub não dispara toda hora (na 1ª semana: a cada 6-12 h).
# Por isso cada execução fica ativa por até ~5h40 e coleta no minuto 17 de
# cada hora (coleta/laco.py). O cron só serve para iniciar uma nova execução
# quando a anterior acaba: com o "concurrency", disparos durante uma execução
# ficam na fila (no máximo um) em vez de rodar em paralelo.
on:
  schedule:
    - cron: "17 * * * *"   # minuto 17 de cada hora (UTC)
  workflow_dispatch:        # permite iniciar manualmente

permissions:
  contents: write

concurrency:
  group: coleta-steam
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # limite do GitHub para um job: 360 min
    defaults:
      run:
        working-directory: "LABORATORIO 05"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Configurar o autor dos commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Coletar de hora em hora
        run: python coleta/laco.py --duracao-min 340 --commit "bash coleta/commitar.sh"
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
