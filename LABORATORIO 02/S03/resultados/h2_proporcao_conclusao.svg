<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="titulo descricao">
<title id="titulo">H2: conclusão dentro de 35 minutos por tratamento</title>
<desc id="descricao">Proporção de trials avaliáveis com 26 casos aprovados no prazo.</desc>
<rect width="760" height="430" fill="white"/>
<text x="45" y="40" font-family="sans-serif" font-size="22" font-weight="bold">H2 — conclusão em 35 minutos</text>
<text x="45" y="67" font-family="sans-serif" font-size="14" fill="#555">26/26 casos aprovados no prazo</text>
<line x1="200" y1="335.0" x2="650" y2="335.0" stroke="#ddd"/>
<text x="163" y="340.0" font-family="sans-serif" font-size="12" fill="#555">0%</text>
<line x1="200" y1="278.75" x2="650" y2="278.75" stroke="#ddd"/>
<text x="163" y="283.75" font-family="sans-serif" font-size="12" fill="#555">25%</text>
<line x1="200" y1="222.5" x2="650" y2="222.5" stroke="#ddd"/>
<text x="163" y="227.5" font-family="sans-serif" font-size="12" fill="#555">50%</text>
<line x1="200" y1="166.25" x2="650" y2="166.25" stroke="#ddd"/>
<text x="163" y="171.25" font-family="sans-serif" font-size="12" fill="#555">75%</text>
<line x1="200" y1="110.0" x2="650" y2="110.0" stroke="#ddd"/>
<text x="163" y="115.0" font-family="sans-serif" font-size="12" fill="#555">100%</text>
<rect x="270" y="110.0" width="100" height="225.0" fill="#2563a6"/>
<text x="320" y="95.0" text-anchor="middle" font-family="sans-serif" font-size="14">2/2 (100.0%)</text>
<text x="320" y="360" text-anchor="middle" font-family="sans-serif" font-size="14">COM_IA</text>
<rect x="500" y="335.0" width="100" height="0.0" fill="#b76b2a"/>
<text x="550" y="320.0" text-anchor="middle" font-family="sans-serif" font-size="14">sem dados</text>
<text x="550" y="360" text-anchor="middle" font-family="sans-serif" font-size="14">SEM_IA</text>
<text x="45" y="405" font-family="sans-serif" font-size="12" fill="#555">Unidade descritiva: trial; pares de McNemar por integrante e família de kata.</text>
</svg>
