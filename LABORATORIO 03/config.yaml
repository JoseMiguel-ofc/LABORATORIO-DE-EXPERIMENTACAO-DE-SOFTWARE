# Configuração do pipeline. Caminhos são relativos a este arquivo.

github:
  # Nome da variável de ambiente com o token. O token nunca vai para o repositório.
  token_env: GITHUB_TOKEN

janela:
  # Datas fixadas pelo professor na abertura do Lab03S01 (inclusivas, UTC).
  inicio: 2025-10-01
  fim: 2026-09-30

busca:
  # Cada faixa é uma consulta separada à Search API (máx. 1.000 resultados cada).
  # Limites inclusivos e sem sobreposição. Faixas com mais de 1.000 repositórios
  # são divididas ao meio automaticamente até caber.
  faixas_estrelas:
    - {min: 1000, max: 1099}
    - {min: 1100, max: 1249}
    - {min: 1250, max: 1499}
    - {min: 1500, max: 1799}
    - {min: 1800, max: 2199}
    - {min: 2200, max: 2799}
    - {min: 2800, max: 3599}
    - {min: 3600, max: 4999}
    - {min: 5000, max: 7499}
    - {min: 7500, max: 11999}
    - {min: 12000, max: 24999}
    - {min: 25000, max: 59999}
    - {min: 60000}
  # Repositórios sem push dentro da janela não podem ter releases nem runs nela.
  filtro_extra: "archived:false pushed:>=2025-10-01"

tags:
  # Variante da RQ 07. Cada tag custa uma chamada à API (data do commit apontado),
  # o que pode somar milhares de chamadas por repositório. Ligar só para a RQ 07.
  coletar: false

filtros:
  releases: 5   # releases publicadas (draft = false, não pré-release) na janela
  runs: 50      # workflow runs com event = push no default branch, conclusão válida

amostra:
  # Lab03S01: 100. Lab03S02: >= 300 (ou null para avaliar todos os candidatos).
  tamanho: 100
  semente: 42

heuristica:
  # Regra de referência da Sprint 2 B; ainda depende de consenso para validação.
  # v1: fix/hotfix/revert; v2: acrescenta flexões. Ambas exigem patch e até 7 dias.
  versao: v1

saida:
  dir: dados
  cache_dir: dados/cache
